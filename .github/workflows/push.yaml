name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    name: Build Docker container and push to registry
    if: github.ref == 'refs/heads/main'
    # Never overlap deployments or cancel between the primary and replicas.
    concurrency:
      group: site-production
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: GHA Nix cache
        uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          primary-key:
            nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or, last accessed more than this number of seconds ago
          # relative to the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: 0
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never

      - run: nix flake check
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm test --run

      - name: Build Docker image
        run: nix build .#container

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        id: push
        run: |
          docker load < result
          docker tag ovyerus-site-container ghcr.io/ovyerus/site:latest
          docker push ghcr.io/ovyerus/site:latest
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' ghcr.io/ovyerus/site:latest)"
          case "$image" in
            ghcr.io/ovyerus/site@sha256:*) ;;
            *) echo "Missing immutable GHCR image digest" >&2; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy primary, then replicas
        run: |
          if ! [[ "$PRIMARY_MACHINE_ID" =~ ^[a-z0-9]+$ ]]; then
            echo "Set the FLY_PRIMARY_MACHINE_ID repository variable to the fixed Sydney Machine ID" >&2
            exit 1
          fi
          if ! [[ "$REPLICA_MACHINE_IDS" =~ ^[a-z0-9]+,[a-z0-9]+$ ]]; then
            echo "Set FLY_REPLICA_MACHINE_IDS to the two volume-backed replica IDs, comma-separated" >&2
            exit 1
          fi
          IFS=, read -r replica_one replica_two <<< "$REPLICA_MACHINE_IDS"
          if [[ "$replica_one" == "$replica_two" || "$replica_one" == "$PRIMARY_MACHINE_ID" || "$replica_two" == "$PRIMARY_MACHINE_ID" ]]; then
            echo "Choose three distinct Machine IDs" >&2
            exit 1
          fi
          nix develop --command fly deploy --image "$DEPLOY_IMAGE" --only-machines "$PRIMARY_MACHINE_ID" --strategy rolling --update-only --ha=false
          nix develop --command fly deploy --image "$DEPLOY_IMAGE" --only-machines "$REPLICA_MACHINE_IDS" --strategy rolling --update-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PRIMARY_MACHINE_ID: ${{ vars.FLY_PRIMARY_MACHINE_ID }}
          REPLICA_MACHINE_IDS: ${{ vars.FLY_REPLICA_MACHINE_IDS }}
          DEPLOY_IMAGE: ${{ steps.push.outputs.image }}
